# Self-hosted n8n for the support chatbot (SQLite inside a named volume; enough for a demo or a small team).
# 1. Copy .env.example to .env and fill it in.
# 2. docker compose up -d
# 3. Open http://localhost:5678, create the owner account, then follow docs/02-setup-guide.md.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: support-chatbot-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/New_York}
      - TZ=${GENERIC_TIMEZONE:-America/New_York}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_EDITOR_BASE_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
